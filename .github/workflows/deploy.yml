name: Deploy to FRT

on:
  push:
    branches: [ main ]

jobs:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "20"

  - name: Install dependencies
    run: npm install

  - name: Build project
    run: npm run build

  - name: Deploy to FRT
    uses: SamKirkland/FRT-Deploy-Action@v4.5
    with:
      secret: ${{ secrets.FRT_SECRET }}
      username: ${{ secrets.FRT_USERNAME }}
      password: ${{ secrets.FRT_PASSWORD }}
      server-uri: ./public_html/
      local-dir: dist/